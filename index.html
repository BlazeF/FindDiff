<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find the Different Shape Game (Hard)</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
    }

    .game-container {
        display: flex;
        justify-content: center;
        margin-top: 50px;
        opacity: 0;
        transition: opacity 0.5s;
    }

    .shape {
        font-size: 50px;
        margin: 0 12px;
    }

    .shape {
        font-size: 50px;
        margin: 0 12px;
    
        /* Sketch-like imperfection */
        filter: blur(0.3px);
        text-shadow:
            0.4px 0.2px 0 rgba(0,0,0,0.35),
           -0.3px -0.2px 0 rgba(0,0,0,0.25);
    }
    

    .shape {
        font-family: "Comic Sans MS", "Segoe Print", "Bradley Hand", cursive;
    }
    

    .buttons-container {
        margin-top: 20px;
    }

    .button {
        padding: 10px 20px;
        margin: 5px;
        font-size: 16px;
        cursor: pointer;
    }

    #result {
        margin-top: 20px;
        font-size: 24px;
    }

    #startButton {
        padding: 15px 30px;
        font-size: 20px;
        margin-top: 50px;
        cursor: pointer;
    }

    #score {
        margin-top: 30px;
        font-size: 22px;
    }
</style>
</head>

<body>

<h1>Find the Different Shape Game (Hard Mode)</h1>

<button id="startButton" onclick="startGame()">Start Game</button>

<div class="game-container" id="gameContainer">
    <div id="shape1" class="shape"></div>
    <div id="shape2" class="shape"></div>
    <div id="shape3" class="shape"></div>
    <div id="shape4" class="shape"></div>
    <div id="shape5" class="shape"></div>
</div>

<div class="buttons-container">
    <button class="button" onclick="checkAnswer(1)">1</button>
    <button class="button" onclick="checkAnswer(2)">2</button>
    <button class="button" onclick="checkAnswer(3)">3</button>
    <button class="button" onclick="checkAnswer(4)">4</button>
    <button class="button" onclick="checkAnswer(5)">5</button>
</div>

<div id="result"></div>
<div id="score">Score: 0/0</div>

<script>
/* ---------------- SHAPE SETS (BLACK & WHITE ONLY) ---------------- */

let confusingPairs = [

    /* SQUARE / BOX FAMILY */
    ["□", "▢", "◻", "⬜"],
    ["■", "◼", "◾", "⬛"],
    ["▣", "▤", "▥", "▦", "▧", "▨", "▩"],

    /* TRIANGLE FAMILY */
    ["△", "▵", "▴"],
    ["▽", "▿", "▾"],
    ["▲", "▴"],
    ["▼", "▾"],

    /* CIRCLE FAMILY */
    ["○", "◯", "◌", "◎"],
    ["●", "◍", "◉"],

    /* DIAMOND / RHOMBUS */
    ["◇", "◆", "◈", "⬦", "⬥"],

    /* ARROWS (DIRECTION-LOCKED) */
    ["→", "⇒", "⟶", "⟹"],
    ["←", "⇐", "⟵", "⟸"],
    ["↑", "⇑", "⟰"],
    ["↓", "⇓", "⟱"],

    /* LINE / STROKE VARIANTS */
    ["—", "–", "―", "─", "━"],
    ["|", "‖", "∣", "│", "┃"],

    /* CROSS / PLUS */
    ["+", "✚", "✛", "✜", "✝"],
    ["×", "✕", "✖"],

    /* MATH LOGIC (VERY HARD) */
    ["∧", "⋀"],
    ["∨", "⋁"],
    ["∩", "⋂"],
    ["∪", "⋃"],
    ["≡", "≣"],
    ["≈", "≋", "≃"],
    ["≠", "≢"],

    /* MISC MICRO-DIFFERENCE */
    ["⌷", "⌸", "⌹"],
    ["⌶", "⌺"],
    ["⌇", "⌗"],
    ["⊕", "⊖", "⊗"],
    ["⊙", "⊚", "⊛"]
];


/* ---------------- GAME STATE ---------------- */

let correctIndex;
let gameInterval;
let startTime;
let correctAnswers = 0;
let totalAttempts = 0;

/* ---------------- UTILS ---------------- */

function updateScore() {
    document.getElementById('score').textContent =
        `Score: ${correctAnswers}/${totalAttempts}`;
}

/* ---------------- SHAPE GENERATION ---------------- */

function getRandomShapeSet() {
    const pair = confusingPairs[Math.floor(Math.random() * confusingPairs.length)];

    const baseShape = pair[Math.floor(Math.random() * pair.length)];
    let differentShape;

    do {
        differentShape = pair[Math.floor(Math.random() * pair.length)];
    } while (differentShape === baseShape);

    correctIndex = Math.floor(Math.random() * 5) + 1;

    let shapeSet = [];
    for (let i = 1; i <= 5; i++) {
        shapeSet.push(i === correctIndex ? differentShape : baseShape);
    }

    return shapeSet;
}

/* ---------------- DISPLAY ---------------- */

function displayShapes() {
    let shapeSet = getRandomShapeSet();

    for (let i = 1; i <= 5; i++) {
        document.getElementById(`shape${i}`).textContent = shapeSet[i - 1];
    }

    let gameContainer = document.getElementById('gameContainer');
    gameContainer.style.opacity = 1;

    setTimeout(() => {
        gameContainer.style.opacity = 0;
    }, 500);   // visibility time unchanged
}

/* ---------------- ANSWER CHECK ---------------- */

function checkAnswer(selectedIndex) {
    let now = new Date().getTime();
    if (now - startTime > 2000) return;  // response window unchanged

    totalAttempts++;

    if (selectedIndex === correctIndex) {
        document.getElementById('result').textContent = "Correct!";
        correctAnswers++;
    } else {
        document.getElementById('result').textContent = "Wrong!";
    }

    updateScore();
}

/* ---------------- GAME CONTROL ---------------- */

function startGame() {
    document.getElementById('startButton').style.display = 'none';

    correctAnswers = 0;
    totalAttempts = 0;
    updateScore();

    startTime = new Date().getTime();
    displayShapes();

    gameInterval = setInterval(() => {
        startTime = new Date().getTime();
        displayShapes();
    }, 800);

    setTimeout(() => {
        clearInterval(gameInterval);
        document.getElementById('result').textContent =
            `Game Over! Final Score: ${correctAnswers}/${totalAttempts}`;
    }, 180000);  // 3 minutes unchanged
}

/* ---------------- KEYBOARD INPUT ---------------- */

document.addEventListener('keydown', function (event) {
    if (event.key >= '1' && event.key <= '5') {
        checkAnswer(parseInt(event.key));
    }
});
</script>

</body>
</html>
