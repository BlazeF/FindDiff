<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find the Different Shape Game (Hard)</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
}

.game-container {
    display: flex;
    justify-content: center;
    margin-top: 50px;
    opacity: 0;
    transition: opacity 0.2s;
}

.shape {
    font-size: 50px;
    margin: 0 35px; /* MORE DISTANCE */
    font-family: "Comic Sans MS", "Segoe Print", "Bradley Hand", cursive;
    filter: blur(0.3px);
    opacity: 0.65; /* LOWER VISIBILITY */
    text-shadow:
        0.4px 0.2px 0 rgba(0,0,0,0.35),
       -0.3px -0.2px 0 rgba(0,0,0,0.25);
}

.buttons-container {
    margin-top: 20px;
}

.button {
    padding: 10px 20px;
    margin: 5px;
    font-size: 16px;
    cursor: pointer;
}

#result {
    margin-top: 20px;
    font-size: 22px;
}

#score {
    margin-top: 20px;
    font-size: 20px;
}

#startButton {
    padding: 15px 30px;
    font-size: 20px;
    margin-top: 40px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>Find the Different Shape Game (Hard Mode)</h1>

<button id="startButton" onclick="startGame()">Start Game</button>

<div class="game-container" id="gameContainer">
    <div id="shape1" class="shape"></div>
    <div id="shape2" class="shape"></div>
    <div id="shape3" class="shape"></div>
    <div id="shape4" class="shape"></div>
    <div id="shape5" class="shape"></div>
</div>

<div class="buttons-container">
    <button class="button" onclick="checkAnswer(1)">1</button>
    <button class="button" onclick="checkAnswer(2)">2</button>
    <button class="button" onclick="checkAnswer(3)">3</button>
    <button class="button" onclick="checkAnswer(4)">4</button>
    <button class="button" onclick="checkAnswer(5)">5</button>
</div>

<div id="result"></div>
<div id="score"></div>

<script>
/* ---------- SHAPES ---------- */

const confusingPairs = [
    ["□","▢","◻","⬜"],
    ["■","◼","◾","⬛"],
    ["△","▵","▴"],
    ["▽","▿","▾"],
    ["○","◯","◌","◎"],
    ["●","◍","◉"],
    ["◇","◆","◈","⬦","⬥"],
    ["→","⇒","⟶"],
    ["←","⇐","⟵"],
    ["↑","⇑"],
    ["↓","⇓"],
    ["—","–","―","─"],
    ["|","‖","│","┃"],
    ["+","✚","✛","✜"],
    ["×","✕","✖"],
    ["≈","≋","≃"],
    ["≠","≢"]
];

/* ---------- GAME STATE ---------- */

let correctIndex = 0;
let round = 0;
let maxRounds = 20;
let correctAnswers = 0;
let waitingForAnswer = false;

/* ---------- UTILS ---------- */

function updateScore() {
    document.getElementById("score").textContent =
        `Round: ${round}/${maxRounds} | Score: ${correctAnswers}`;
}

function hideShapes() {
    document.getElementById("gameContainer").style.opacity = 0;
}

/* ---------- ROUND LOGIC ---------- */

function generateShapes() {
    const pair = confusingPairs[Math.floor(Math.random() * confusingPairs.length)];
    const base = pair[Math.floor(Math.random() * pair.length)];

    let diff;
    do {
        diff = pair[Math.floor(Math.random() * pair.length)];
    } while (diff === base);

    correctIndex = Math.floor(Math.random() * 5) + 1;

    for (let i = 1; i <= 5; i++) {
        document.getElementById("shape" + i).textContent =
            (i === correctIndex) ? diff : base;
    }

    const container = document.getElementById("gameContainer");
    container.style.opacity = 1;

    setTimeout(hideShapes, 300); // VISIBILITY = 300ms

    waitingForAnswer = true;
}

/* ---------- ANSWER ---------- */

function checkAnswer(index) {
    if (!waitingForAnswer) return;

    waitingForAnswer = false;
    round++;

    if (index === correctIndex) {
        correctAnswers++;
        document.getElementById("result").textContent = "Correct!";
    } else {
        document.getElementById("result").textContent = "Wrong!";
    }

    updateScore();

    if (round < maxRounds) {
        setTimeout(generateShapes, 300);
    } else {
        endGame();
    }
}

/* ---------- GAME CONTROL ---------- */

function startGame() {
    document.getElementById("startButton").style.display = "none";
    document.getElementById("result").textContent = "";

    round = 0;
    correctAnswers = 0;
    updateScore();

    generateShapes();
}

function endGame() {
    hideShapes();
    document.getElementById("result").textContent =
        `Game Over! Final Score: ${correctAnswers}/${maxRounds}`;
    document.getElementById("startButton").style.display = "inline-block";
}

/* ---------- KEYBOARD ---------- */

document.addEventListener("keydown", e => {
    if (e.key >= "1" && e.key <= "5") {
        checkAnswer(parseInt(e.key));
    }
});
</script>

</body>
</html>
