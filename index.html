<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the Different Shape Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .game-container {
            display: flex;
            justify-content: center;
            margin-top: 50px;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .shape {
            font-size: 50px;
            margin: 0 10px;
        }

        .buttons-container {
            margin-top: 20px;
        }

        .button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 24px;
        }

        #startButton {
            padding: 15px 30px;
            font-size: 20px;
            margin-top: 50px;
            cursor: pointer;
        }

        #score {
            margin-top: 30px;
            font-size: 22px;
        }

        @media (max-width: 768px) {
            .shape {
                font-size: 40px;
                margin: 0 8px;
            }

            .button {
                padding: 8px 16px;
                font-size: 14px;
            }

            #startButton {
                padding: 12px 24px;
                font-size: 18px;
            }

            #result {
                font-size: 20px;
            }

            #score {
                font-size: 20px;
            }
        }

        @media (max-width: 480px) {
            .shape {
                font-size: 30px;
                margin: 0 5px;
            }

            .button {
                padding: 5px 10px;
                font-size: 12px;
            }

            #startButton {
                padding: 10px 20px;
                font-size: 16px;
            }

            #result {
                font-size: 18px;
            }

            #score {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <h1>Find the Different Shape Game</h1>

    <button id="startButton" onclick="startGame()">Start Game</button>

    <div class="game-container" id="gameContainer">
        <div id="shape1" class="shape"></div>
        <div id="shape2" class="shape"></div>
        <div id="shape3" class="shape"></div>
        <div id="shape4" class="shape"></div>
        <div id="shape5" class="shape"></div>
    </div>

    <div class="buttons-container">
        <button class="button" onclick="checkAnswer(1)">1</button>
        <button class="button" onclick="checkAnswer(2)">2</button>
        <button class="button" onclick="checkAnswer(3)">3</button>
        <button class="button" onclick="checkAnswer(4)">4</button>
        <button class="button" onclick="checkAnswer(5)">5</button>
    </div>

    <div id="result"></div>
    <div id="score">Score: 0/0</div>

    <script>
        let shapes = {
            arrows: ["⤷", "⤸", "⤹", "⤺", "⤻", "⤼", "⤽", "⤾", "⤿", "⥀", "⥁", "⥂", "⥃", "⥄", "⥅", "⥆", "⥇", "⥈", "⥉", "⥊", "⥋", "⥌", "⥍", "⥎", "⥏", "⥐", "⥑", "⥒", "⥓", "⥔", "⥕", "⥖", "⥗", "⥘", "⥙", "⥚", "⥛", "⥜", "⥝", "⥞", "⥟", "⥠", "⥡", "⥢", "⥣", "⥤", "⥥", "⥦", "⥧", "⥨", "⥩", "⥪", "⥫", "⥬", "⥭", "⥮", "⥯", "⥰", "⥱", "⥲", "⥳", "⥴", "⥵", "⥶"],
            hearts: ["❤️", "💛", "💚", "💙", "💜", "🧡", "💖", "💗", "💓", "💞", "💘", "💝", "💟", "💔", "💕", "❣️", "🫶", "💌", "❤️‍🔥", "❤️‍🩹"],
            colors: ["🔴", "🟠", "🟡", "🟢", "🔵", "🟣", "🟤", "⚫", "⚪"],
            squares: ["🟥", "🟧", "🟨", "🟩", "🟦", "🟪", "🟫", "⬛", "⬜", "◼", "◻", "▪️", "▫️", "🔲", "🔳"]
        };

        let correctIndex;
        let gameInterval;
        let startTime;
        let correctAnswers = 0;
        let totalAttempts = 0;

        function updateScore() {
            document.getElementById('score').textContent = `Score: ${correctAnswers}/${totalAttempts}`;
        }

        function getRandomShapeSet() {
            const shapeClasses = Object.keys(shapes);
            const selectedClass = shapeClasses[Math.floor(Math.random() * shapeClasses.length)];
            const selectedShapes = shapes[selectedClass];

            let baseShape = selectedShapes[Math.floor(Math.random() * selectedShapes.length)];
            let differentShape;
            do {
                differentShape = selectedShapes[Math.floor(Math.random() * selectedShapes.length)];
            } while (differentShape === baseShape);

            correctIndex = Math.floor(Math.random() * 5) + 1;

            let shapeSet = [];
            for (let i = 1; i <= 5; i++) {
                shapeSet.push(i === correctIndex ? differentShape : baseShape);
            }
            return shapeSet;
        }

        function displayShapes() {
            let shapeSet = getRandomShapeSet();
            for (let i = 1; i <= 5; i++) {
                document.getElementById(`shape${i}`).textContent = shapeSet[i - 1];
            }

            let gameContainer = document.getElementById('gameContainer');
            gameContainer.style.opacity = 1;
            setTimeout(() => {
                gameContainer.style.opacity = 0;
            }, 500);
        }

        function checkAnswer(selectedIndex) {
            let now = new Date().getTime();
            if (now - startTime > 2000) return;

            totalAttempts++;
            if (selectedIndex === correctIndex) {
                document.getElementById('result').textContent = "Correct!";
                correctAnswers++;
            } else {
                document.getElementById('result').textContent = "Wrong!";
            }
            updateScore();
        }

        function startGame() {
            document.getElementById('startButton').style.display = 'none';
            correctAnswers = 0;
            totalAttempts = 0;
            updateScore();

            startTime = new Date().getTime();
            displayShapes();
            gameInterval = setInterval(() => {
                startTime = new Date().getTime();
                displayShapes();
            }, 800);

            setTimeout(() => {
                clearInterval(gameInterval);
                document.getElementById('result').textContent = `Game Over! Final Score: ${correctAnswers}/${totalAttempts}`;
            }, 180000);
        }

        // Keyboard input handler: 1 to 5 keys
        document.addEventListener('keydown', function(event) {
            if (event.key >= '1' && event.key <= '5') {
                checkAnswer(parseInt(event.key));
            }
        });
    </script>
</body>
</html>
